services:
  - type: web
    name: trello-kanban-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trello-kanban-db
          property: connectionString
      - key: CLIENT_URLS
        sync: false
      - key: DATABASE_SSL
        value: false

databases:
  - name: trello-kanban-db
    plan: free
